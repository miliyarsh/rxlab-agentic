[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxlab-agentic"
version = "0.1.0"
description = "Multi-agent pharmacogenomic platform on AWS Lambda + Step Functions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Iliya Yaroshevskiy", email = "miliyarsh@gmail.com" }]
keywords = ["aws", "lambda", "bedrock", "fhir", "pharmacogenomics", "platform"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]

dependencies = [
  "pydantic>=2.6,<3",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "moto[dynamodb,s3,stepfunctions,sns,ssm]>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "boto3-stubs[essential,dynamodb,s3,stepfunctions,sns,ssm,bedrock-runtime]>=1.34",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["service*"]
exclude = ["service.tests*"]

# ---------- Ruff ----------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["infra", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "RUF",
  "SIM",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"service/tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"

# ---------- Mypy ----------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/", "\\.venv/"]

[[tool.mypy.overrides]]
module = "service.tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- Pytest ----------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["service/tests"]
pythonpath = ["."]
markers = [
  "unit: pure unit tests (no AWS)",
  "integration: integration tests using moto",
  "contract: end-to-end against the deployed dev API",
]

[tool.coverage.run]
branch = true
source = ["service"]
omit = ["service/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
