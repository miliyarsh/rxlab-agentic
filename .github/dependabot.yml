version: 2
updates:
  # Python service deps (pyproject.toml lands in Phase 2).
  - package-ecosystem: "pip"
    directory: "/service"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Terraform module providers.
  - package-ecosystem: "terraform"
    directory: "/infra/envs/dev"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(infra/deps)"

  - package-ecosystem: "terraform"
    directory: "/infra/envs/prod"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(infra/deps)"

  # GitHub Actions versions (workflows land in Phase 4).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
