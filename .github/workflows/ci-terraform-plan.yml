name: CI — Terraform Plan (PR)

# Single-environment model: PRs (especially the Release PR `development -> main`)
# get a no-op-friendly plan against the single stack at `infra/envs/dev`.

on:
  pull_request:
    branches: [development, main]
    paths:
      - "infra/**"
      - ".github/workflows/ci-terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_ENV: infra/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/

      - name: Terraform init + validate (${{ env.TF_ENV }})
        working-directory: ${{ env.TF_ENV }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Terraform plan (${{ env.TF_ENV }})
        id: plan
        continue-on-error: true
        working-directory: ${{ env.TF_ENV }}
        run: |
          terraform plan -no-color -input=false 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = `${{ env.TF_ENV }}/plan.txt`;
            let body = 'Terraform plan output unavailable (backend not initialized in PR).';
            try {
              const text = fs.readFileSync(path, 'utf8');
              body = '```\n' + text.slice(-60000) + '\n```';
            } catch (e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan (\`${{ env.TF_ENV }}\` — single environment)\n\n` + body
            });
