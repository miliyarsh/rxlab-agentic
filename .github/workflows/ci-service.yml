name: CI — Service

on:
  push:
    branches: [development, main]
    paths:
      - "service/**"
      - "pyproject.toml"
      - ".github/workflows/ci-service.yml"
  pull_request:
    branches: [development, main]
    paths:
      - "service/**"
      - "pyproject.toml"
      - ".github/workflows/ci-service.yml"

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check service/
          ruff format --check service/

      - name: Mypy
        run: mypy service/

      - name: Pytest (unit)
        run: pytest -m "not integration and not contract" -v

      - name: Pytest (integration)
        run: pytest -m integration -v

  analyzer-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Analyzer container
        run: docker build -f service/agents/analyzer/Dockerfile -t rxlab-analyzer:ci .

      - name: Trivy scan (optional)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rxlab-analyzer:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and scan tools
        run: |
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Bandit
        run: bandit -r service/ -x service/tests

      - name: pip-audit
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip-audit
